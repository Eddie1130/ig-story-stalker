services:
  ig-watch:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: ["node", "/app/src/watch-media.mjs"]
    shm_size: "512mb"
    env_file:
      - .env.telegram
    environment:
      TZ: Asia/Hong_Kong
      IG_TELEGRAM_CONTROL: ${IG_TELEGRAM_CONTROL:-1}
      IG_TARGET_USERNAMES: ${IG_TARGET_USERNAMES:-}
      IG_TARGET_USERNAME: ${IG_TARGET_USERNAME:-}
      IG_TARGET_USER_ID: ${IG_TARGET_USER_ID:-}
      IG_CHECK_INTERVAL_SECONDS: ${IG_CHECK_INTERVAL_SECONDS:-300}
      IG_ARCHIVE_DIR: /downloads
      IG_CATALOG_ENABLED: ${IG_CATALOG_ENABLED:-1}
      IG_POSTS_INTERVAL_SECONDS: ${IG_POSTS_INTERVAL_SECONDS:-900}
      IG_HIGHLIGHTS_INTERVAL_SECONDS: ${IG_HIGHLIGHTS_INTERVAL_SECONDS:-900}
      IG_POSTS_DOC_ID: ${IG_POSTS_DOC_ID:-28322872020710458}
      IG_POSTS_PAGE_DOC_ID: ${IG_POSTS_PAGE_DOC_ID:-39535953862670189}
    depends_on:
      ig-telegram:
        condition: service_healthy
    volumes:
      - ${IG_DATA_DIR:-./data}/profile:/data/profile
      - ${IG_LOG_DIR:-./logs}:/app/logs
      - ./src:/app/src:ro
      - ${IG_DATA_DIR:-./data}/watch:/app/state
      - ${IG_DATA_DIR:-./data}/watchdog:/app/watchdog-state:ro
      - ${IG_DATA_DIR:-./data}/control:/app/control:ro
      - ${IG_DOWNLOAD_DIR:-./downloads}:/downloads
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const s=JSON.parse(fs.readFileSync('/app/state/health.json'));process.exit(Date.now()-s.at<480000&&s.failures<3&&s.telegramOk&&s.archiveOk&&s.catalogOk?0:1)"]
      interval: 60s
      timeout: 5s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  ig-telegram:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    init: true
    command: ["node", "/app/src/telegram-control.mjs"]
    env_file:
      - .env.telegram
    environment:
      TZ: Asia/Hong_Kong
      IG_ARCHIVE_DIR: /downloads
      IG_TELEGRAM_CONTROL: ${IG_TELEGRAM_CONTROL:-1}
      IG_TARGET_USERNAMES: ${IG_TARGET_USERNAMES:-}
      IG_TARGET_USERNAME: ${IG_TARGET_USERNAME:-}
      IG_TARGET_USER_ID: ${IG_TARGET_USER_ID:-}
    volumes:
      - ./src:/app/src:ro
      - ${IG_DATA_DIR:-./data}/control:/app/control
      - ${IG_DOWNLOAD_DIR:-./downloads}:/downloads:ro
      - ${IG_DATA_DIR:-./data}/watch:/app/state
      - ${IG_DATA_DIR:-./data}/watchdog:/app/watchdog-state:ro
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "const h=JSON.parse(require('fs').readFileSync('/app/control/health.json'));process.exit(Date.now()-h.at<120000&&h.pollOk&&Date.now()-h.lastPollAt<120000?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
