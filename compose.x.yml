services:
  x-watch:
    build:
      context: .
      dockerfile: Dockerfile.x
    init: true
    command: ["node", "/app/src/x-watch.mjs"]
    environment:
      TZ: Asia/Hong_Kong
      X_ENABLED: ${X_ENABLED:-1}
      X_HISTORY_ENABLED: ${X_HISTORY_ENABLED:-1}
      X_CHECK_INTERVAL_SECONDS: ${X_CHECK_INTERVAL_SECONDS:-300}
      X_ACCOUNTS_DB: /app/x-accounts/accounts.db
      IG_ARCHIVE_DIR: /downloads
      IG_CONTROL_DIR: /app/control
      IG_TELEGRAM_CONTROL: ${IG_TELEGRAM_CONTROL:-1}
      IG_STATE_DIR: /app/state
    depends_on:
      ig-telegram:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ${IG_DATA_DIR:-./data}/watch:/app/state
      - ${IG_DATA_DIR:-./data}/control:/app/control:ro
      - ${IG_DOWNLOAD_DIR:-./downloads}:/downloads
      - ${X_ACCOUNTS_DIR:-./data/x-accounts}:/app/x-accounts
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "node", "-e", "const h=JSON.parse(require('fs').readFileSync('/app/state/x/health.json'));process.exit(Date.now()-h.at<120000&&h.phase!=='fatal'&&h.phase!=='stopped'&&(!h.enabled||h.targets.every(t=>!t.failures))?0:1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
  ig-telegram:
    environment:
      X_ENABLED: ${X_ENABLED:-1}
      X_TARGET_USERNAMES: ${X_TARGET_USERNAMES:-}
